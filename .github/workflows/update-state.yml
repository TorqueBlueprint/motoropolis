name: Update subscribers and names

on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live numbers from YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/update_state.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- state.json; then echo "nothing to commit"; exit 0; fi
          git config user.name "motoropolis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update subscribers and Wall of Mechanics"
          git push
